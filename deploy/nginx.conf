# /etc/nginx/sites-available/srls
# Replace YOUR_SUBDOMAIN and the root path, then enable the site.
# Certbot will add the HTTPS (443) server block and HTTP->HTTPS redirect automatically.

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_SUBDOMAIN;

    # Built React app (frontend/dist copied here)
    root /var/www/srls;
    index index.html;

    # Security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # API -> Node.js backend
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Long cache for fingerprinted build assets
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # SPA fallback: lets /students, /results?exam=... etc. work on refresh
    location / {
        expires -1;   # always revalidate index.html so new deploys show up
        try_files $uri $uri/ /index.html;
    }

    client_max_body_size 1m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
